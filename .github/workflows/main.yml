name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  push: {branches: ["master", "main"]}
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # The upstream Manager badge queries retired Projects (classic).
      # Skip only that badge without requiring additional Projects permissions.
      - name: Prepare Metrics with the Achievements compatibility fix
        run: |
          docker build -t metrics:3.34.0-beta - <<'DOCKERFILE'
          FROM ghcr.io/lowlighter/metrics@sha256:b8013996b12be3ea049fad2e18db6b31083575a197e43ed63a690a094b9164fb
          WORKDIR /metrics
          RUN sed -i '/^    projects(first:/,/^    }/d' source/plugins/achievements/queries/achievements.graphql && sed -i '/^  \/\/Manager$/,/^  \/\/Reviewer$/{ /^  \/\/Reviewer$/!d; }' source/plugins/achievements/list/users.mjs
          DOCKERFILE
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # 3.34.0-beta
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}

          user: bryan292
          template: classic
          base: header, activity, community, repositories, metadata
          config_animations: yes
          config_timezone: America/Chicago
          optimize: no
          repositories_forks: yes
          use_prebuilt_image: no

          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: A
          plugin_achievements_ignored: explorer, infographile, member, worker, verified
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_skipped: Python, Ruby   
          plugin_lines: yes
          #plugin_notable: yes
          #plugin_notable_filter: stars:>100
          #plugin_notable_repositories: yes
          #plugin_topics: yes
          #plugin_topics_mode: mastered
          #plugin_topics_limit: 20
